<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>都更管理系統</title>
<script>
  (function () {
    var saved = localStorage.getItem("theme");
    if (saved === "light" || saved === "dark") {
      document.documentElement.setAttribute("data-theme", saved);
    }
  })();
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;900&display=swap');

  :root {
    color-scheme: light;
    --brand: #2dd4dd;
    --brand-dark: #0f9ba3;
    --brand-light: #e3fbfc;
    --bg: #f2f6f7;
    --surface: #ffffff;
    --surface-2: #f5f8f9;
    --border: #e4ebec;
    --text: #172527;
    --text-muted: #71838a;
    --danger: #e6584f;
    --danger-light: #fdecea;
    --warning: #e2a13c;
    --warning-light: #fdf3e0;
    --success: #2fae72;
    --success-light: #e5f8ee;
    --info: #4d5fb0;
    --info-light: #eef1fb;
    --nav-bg: rgba(255, 255, 255, .85);
    --card-rim: rgba(255, 255, 255, .6);
    --login-glow: #eafcfc;
    --overlay: rgba(12, 22, 24, .5);
    --toast-bg: #1c2b2d;
    --scrollbar-thumb: #cbd7d9;
    --scrollbar-thumb-hover: #b3c2c4;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 1px 2px rgba(15, 35, 38, .04), 0 6px 20px -6px rgba(15, 35, 38, .10);
    --shadow-hover: 0 4px 10px rgba(15, 35, 38, .06), 0 16px 32px -12px rgba(15, 35, 38, .18);
    --shadow-modal: 0 20px 60px -12px rgba(10, 25, 28, .35);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --brand: #2dd4dd;
      --brand-dark: #55c9d1;
      --brand-light: rgba(45, 212, 221, .16);
      --bg: #0e1618;
      --surface: #172224;
      --surface-2: #1f2c2e;
      --border: #2a3a3c;
      --text: #e7f1f2;
      --text-muted: #93a7aa;
      --danger: #ff7a70;
      --danger-light: rgba(255, 122, 112, .16);
      --warning: #f0b45c;
      --warning-light: rgba(240, 180, 92, .14);
      --success: #4ecb8d;
      --success-light: rgba(78, 203, 141, .14);
      --info: #98a5e6;
      --info-light: rgba(152, 165, 230, .16);
      --nav-bg: rgba(23, 34, 36, .85);
      --card-rim: rgba(255, 255, 255, .06);
      --login-glow: #0f2224;
      --overlay: rgba(0, 0, 0, .6);
      --scrollbar-thumb: #38494b;
      --scrollbar-thumb-hover: #4a5f61;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px -6px rgba(0, 0, 0, .45);
      --shadow-hover: 0 4px 10px rgba(0, 0, 0, .35), 0 16px 32px -12px rgba(0, 0, 0, .55);
      --shadow-modal: 0 20px 60px -12px rgba(0, 0, 0, .6);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --brand: #2dd4dd;
    --brand-dark: #55c9d1;
    --brand-light: rgba(45, 212, 221, .16);
    --bg: #0e1618;
    --surface: #172224;
    --surface-2: #1f2c2e;
    --border: #2a3a3c;
    --text: #e7f1f2;
    --text-muted: #93a7aa;
    --danger: #ff7a70;
    --danger-light: rgba(255, 122, 112, .16);
    --warning: #f0b45c;
    --warning-light: rgba(240, 180, 92, .14);
    --success: #4ecb8d;
    --success-light: rgba(78, 203, 141, .14);
    --info: #98a5e6;
    --info-light: rgba(152, 165, 230, .16);
    --nav-bg: rgba(23, 34, 36, .85);
    --card-rim: rgba(255, 255, 255, .06);
    --login-glow: #0f2224;
    --overlay: rgba(0, 0, 0, .6);
    --scrollbar-thumb: #38494b;
    --scrollbar-thumb-hover: #4a5f61;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px -6px rgba(0, 0, 0, .45);
    --shadow-hover: 0 4px 10px rgba(0, 0, 0, .35), 0 16px 32px -12px rgba(0, 0, 0, .55);
    --shadow-modal: 0 20px 60px -12px rgba(0, 0, 0, .6);
  }
  * { box-sizing: border-box; }
  html { scrollbar-color: var(--scrollbar-thumb) transparent; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 100px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-thumb-hover); }
  body {
    margin: 0;
    font-family: "Noto Sans TC", -apple-system, "Segoe UI", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    letter-spacing: .1px;
    transition: background .2s ease, color .2s ease;
  }
  .hidden { display: none !important; }
  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    border-radius: var(--radius-sm);
    padding: 8px 16px;
    font-size: 15.5px;
    transition: transform .15s ease, box-shadow .15s ease, opacity .15s ease, background .15s ease, border-color .15s ease;
  }
  button:hover { opacity: 0.94; }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .btn-primary {
    background: linear-gradient(135deg, var(--brand), var(--brand-dark));
    color: #fff; font-weight: 700;
    box-shadow: 0 2px 6px -1px rgba(15, 155, 163, .45);
  }
  .btn-primary:hover { box-shadow: 0 4px 12px -1px rgba(15, 155, 163, .55); transform: translateY(-1px); opacity: 1; }
  .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); font-weight: 600; }
  .btn-secondary:hover { border-color: var(--text-muted); background: var(--surface-2); opacity: 1; }
  .btn-danger { background: var(--danger); color: #fff; font-weight: 600; box-shadow: 0 2px 6px -1px rgba(230, 88, 79, .4); }
  .btn-warning { background: var(--warning); color: #fff; font-weight: 600; box-shadow: 0 2px 6px -1px rgba(226, 161, 60, .4); }
  .btn-sm { padding: 5px 10px; font-size: 14px; }
  .btn-link { background: none; color: var(--brand-dark); padding: 2px 4px; text-decoration: underline; font-weight: 600; box-shadow: none; }
  .btn-link:hover { opacity: 1; color: var(--brand); }
  input, select, textarea {
    font-family: inherit;
    font-size: 15.5px;
    padding: 9px 11px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    width: 100%;
    background: var(--surface-2);
    color: var(--text);
    transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  input:hover, select:hover, textarea:hover { border-color: var(--text-muted); }
  input:focus, select:focus, textarea:focus {
    outline: none; border-color: var(--brand); background: var(--surface);
    box-shadow: 0 0 0 3px rgba(45, 212, 221, .18);
  }
  label { display: block; font-size: 14px; color: var(--text-muted); margin-bottom: 5px; font-weight: 700; letter-spacing: .02em; }
  .field { margin-bottom: 14px; }
  .field-row { display: flex; gap: 12px; }
  .field-row > .field { flex: 1; }

  /* ---------- Login ---------- */
  #view-login {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(560px circle at 12% 15%, rgba(45, 212, 221, .16), transparent 60%),
      radial-gradient(680px circle at 90% 85%, rgba(15, 155, 163, .12), transparent 60%),
      linear-gradient(160deg, var(--login-glow) 0%, var(--bg) 55%);
  }
  .login-card {
    background: var(--surface);
    border-radius: 18px;
    box-shadow: var(--shadow-modal);
    border: 1px solid var(--card-rim);
    padding: 44px 38px;
    width: 350px;
    position: relative;
    z-index: 1;
    animation: login-in .5s cubic-bezier(.22,1,.36,1);
  }
  @keyframes login-in {
    from { opacity: 0; transform: translateY(14px) scale(.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .login-card h1 {
    font-size: 28px;
    text-align: center;
    margin: 0 0 6px;
    font-weight: 900;
    letter-spacing: .01em;
    background: linear-gradient(135deg, var(--brand), var(--brand-dark));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .login-card .subtitle {
    text-align: center;
    color: var(--text-muted);
    font-size: 14.5px;
    margin-bottom: 26px;
  }
  .login-brand-dot {
    margin: 0 auto 14px;
    display: flex; align-items: center; justify-content: center;
  }
  .login-brand-dot img { height: 116px; width: auto; display: block; }
  #login-form .btn-primary { padding: 10px 16px; font-size: 16px; margin-top: 4px; }

  /* ---------- App shell ---------- */
  #app { min-height: 100vh; display: flex; flex-direction: column; }
  .navbar {
    background: var(--nav-bg);
    backdrop-filter: blur(10px) saturate(1.4);
    -webkit-backdrop-filter: blur(10px) saturate(1.4);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 24px;
    height: 72px;
    gap: 24px;
    position: sticky;
    top: 0;
    z-index: 20;
  }
  .navbar .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17.5px; letter-spacing: .02em; }
  .navbar .brand .brand-text {
    font-size: 21px; font-weight: 900; letter-spacing: .01em;
    background: linear-gradient(135deg, var(--brand), var(--brand-dark));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .navbar .brand-dot {
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .navbar .brand-dot img { height: 54px; width: auto; display: block; }
  .nav-links { display: flex; gap: 4px; flex: 1; }
  .nav-link {
    background: none; color: var(--text-muted); font-weight: 600; padding: 8px 14px; border-radius: var(--radius-sm);
  }
  .nav-link:hover { background: var(--surface-2); color: var(--text); opacity: 1; }
  .nav-link.active { background: var(--brand-light); color: var(--brand-dark); }
  .nav-link.active:hover { background: var(--brand-light); }
  .nav-user { display: flex; align-items: center; gap: 10px; font-size: 14.5px; color: var(--text-muted); }
  #theme-toggle-btn { display: flex; align-items: center; justify-content: center; padding: 6px; width: 30px; height: 30px; }
  #theme-toggle-btn svg { width: 15px; height: 15px; }
  .avatar-menu { position: relative; }
  .avatar-btn {
    width: 36px; height: 36px; border-radius: 50%; padding: 0; border: none; flex-shrink: 0;
    background: linear-gradient(135deg, var(--brand), var(--brand-dark));
    color: #fff; font-weight: 700; font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 6px -1px rgba(15, 155, 163, .5);
  }
  .avatar-btn:hover { opacity: .92; transform: translateY(-1px); }
  .avatar-dropdown {
    position: absolute; top: calc(100% + 10px); right: 0; width: 220px; z-index: 30;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow-modal); padding: 6px; display: flex; flex-direction: column; gap: 2px;
    animation: modal-in .16s cubic-bezier(.22,1,.36,1);
  }
  .avatar-dropdown-header { padding: 10px 10px 8px; }
  .avatar-dropdown-name { font-weight: 700; font-size: 14px; color: var(--text); margin-bottom: 6px; }
  .avatar-dropdown-divider { border-top: 1px solid var(--border); margin: 4px 2px; }
  .avatar-dropdown-item {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    background: none; color: var(--text); font-weight: 600; font-size: 13.5px;
    padding: 9px 10px; border-radius: var(--radius-sm);
  }
  .avatar-dropdown-item:hover { background: var(--surface-2); opacity: 1; }
  .avatar-dropdown-item.active { background: var(--brand-light); color: var(--brand-dark); }
  .avatar-dropdown-item.danger { color: var(--danger); }
  .avatar-dropdown-item.danger:hover { background: var(--danger-light); }
  .avatar-dropdown-item svg { width: 15px; height: 15px; flex-shrink: 0; }
  .role-badge {
    font-size: 12.5px; font-weight: 700; padding: 3px 9px; border-radius: 100px;
    background: var(--surface-2); color: var(--text-muted); letter-spacing: .02em;
  }
  .role-badge.admin { background: var(--warning-light); color: var(--warning); }
  .role-badge.staff { background: var(--brand-light); color: var(--brand-dark); }
  .role-badge.public { background: var(--info-light); color: var(--info); }

  main { flex: 1; padding: 28px 24px 60px; max-width: 1200px; margin: 0 auto; width: 100%; }
  .app-footer {
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
    padding: 18px 24px; font-size: 13px; color: var(--text-muted);
    border-top: 1px solid var(--border);
  }
  .app-footer-brand { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--text); }
  .app-footer-brand svg { width: 19px; height: 19px; color: var(--brand); flex-shrink: 0; }
  .login-footer {
    position: absolute; left: 0; right: 0; bottom: 18px; border-top: none; z-index: 1;
  }

  /* ---------- Dashboard ---------- */
  .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .page-header h2 { margin: 0; font-size: 22.5px; font-weight: 800; letter-spacing: .01em; }
  .project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .card {
    background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 18px; border: 1px solid var(--border);
  }
  .project-card { cursor: pointer; display: flex; flex-direction: column; gap: 12px; transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease; }
  .project-card:hover { border-color: var(--brand); box-shadow: var(--shadow-hover); transform: translateY(-3px); }
  .project-card-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .project-card h3 { margin: 0 0 2px; font-size: 16.5px; font-weight: 700; }
  .project-code { font-size: 13.5px; color: var(--text-muted); }
  .status-badge { font-size: 12.5px; font-weight: 700; padding: 3px 9px; border-radius: 100px; letter-spacing: .02em; white-space: nowrap; }
  .status-active { background: var(--success-light); color: var(--success); }
  .status-closed { background: var(--surface-2); color: var(--text-muted); }
  .status-suspended { background: var(--warning-light); color: var(--warning); }
  .progress-bar-track { background: var(--surface-2); border-radius: 100px; height: 8px; overflow: hidden; }
  .progress-bar-fill { background: linear-gradient(90deg, var(--brand), var(--brand-dark)); height: 100%; border-radius: 100px; transition: width .4s ease; }
  .card-meta-row { display: flex; justify-content: space-between; font-size: 13.5px; color: var(--text-muted); }
  .badge-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .mini-badge { font-size: 12.5px; padding: 3px 9px; border-radius: 100px; background: var(--surface-2); color: var(--text-muted); font-weight: 600; }
  .mini-badge.alert { background: var(--danger-light); color: var(--danger); font-weight: 700; }
  .mini-badge.gate-ok { background: var(--success-light); color: var(--success); font-weight: 700; }
  .empty-state { text-align: center; color: var(--text-muted); padding: 70px 20px; font-size: 15px; }

  /* ---------- Project detail ---------- */
  .back-link { background: none; color: var(--text-muted); font-weight: 600; padding: 4px 0; margin-bottom: 12px; }
  .back-link:hover { color: var(--brand-dark); opacity: 1; }
  .project-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
  .project-header h2 { margin: 0 0 4px; font-size: 21.5px; font-weight: 800; }
  .project-header .sub { color: var(--text-muted); font-size: 14.5px; }
  .tab-bar { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 20px; flex-wrap: wrap; }
  .tab-btn {
    background: none; color: var(--text-muted); font-weight: 600; padding: 10px 16px;
    border-radius: var(--radius-sm) var(--radius-sm) 0 0; border-bottom: 2px solid transparent;
    position: relative; top: 1px;
  }
  .tab-btn:hover { color: var(--text); background: var(--surface-2); opacity: 1; }
  .tab-btn.active { color: var(--brand-dark); border-bottom-color: var(--brand); font-weight: 700; }
  .tab-btn.active:hover { background: none; }

  table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: var(--radius); overflow: hidden; }
  thead th {
    text-align: left; font-size: 13px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; font-weight: 700;
    padding: 11px 14px; border-bottom: 1px solid var(--border); background: var(--surface-2);
  }
  tbody td { padding: 11px 14px; border-bottom: 1px solid var(--border); font-size: 15px; vertical-align: top; }
  tbody tr { transition: background .12s ease; }
  tbody tr:hover { background: var(--surface-2); }
  tbody tr:last-child td { border-bottom: none; }
  .table-wrap { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--border); overflow-x: auto; }
  .actions-cell { display: flex; gap: 6px; flex-wrap: wrap; }
  .contact-status-badge, .consent-status-badge {
    font-size: 12.5px; font-weight: 700; padding: 3px 9px; border-radius: 100px; display: inline-block; letter-spacing: .01em;
  }
  .cs-not_contacted { background: var(--surface-2); color: var(--text-muted); }
  .cs-contacted { background: var(--info-light); color: var(--info); }
  .cs-declined { background: var(--danger-light); color: var(--danger); }
  .cs-agreed, .cs-completed { background: var(--success-light); color: var(--success); }
  .cs-pending { background: var(--surface-2); color: var(--text-muted); }
  .cs-opposed { background: var(--danger-light); color: var(--danger); }
  .sub-detail { background: var(--surface-2); padding: 12px 14px; border-radius: var(--radius-sm); margin-top: 6px; font-size: 14px; color: var(--text-muted); line-height: 1.6; }
  .sub-detail table { box-shadow: none; }

  .section-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 10px; flex-wrap: wrap; }
  .section-toolbar h3 { margin: 0; font-size: 16.5px; font-weight: 700; }

  /* ---------- SOP stepper ---------- */
  .sop-stepper { display: flex; flex-wrap: wrap; gap: 0; margin-bottom: 24px; }
  .sop-node { display: flex; flex-direction: column; align-items: center; width: 96px; position: relative; }
  .sop-node .circle {
    width: 34px; height: 34px; border-radius: 50%; background: var(--surface-2); color: var(--text-muted);
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14.5px;
    border: 2px solid var(--surface-2); z-index: 1; transition: all .25s ease;
  }
  .sop-node .line {
    position: absolute; top: 17px; left: -48px; width: 96px; height: 2px; background: var(--surface-2); z-index: 0; transition: background .25s ease;
  }
  .sop-node:first-child .line { display: none; }
  .sop-node .label { font-size: 12px; text-align: center; margin-top: 7px; color: var(--text-muted); line-height: 1.35; }
  .sop-node.completed .circle { background: linear-gradient(135deg, var(--brand), var(--brand-dark)); border-color: var(--brand); color: #fff; }
  .sop-node.completed .line { background: var(--brand); }
  .sop-node.force_closed .circle { background: var(--warning); border-color: var(--warning); color: #fff; }
  .sop-node.force_closed .line { background: var(--warning); }
  .sop-node.current .circle { border-color: var(--brand); color: var(--brand-dark); box-shadow: 0 0 0 5px var(--brand-light); }
  .sop-node.current .label { color: var(--text); font-weight: 700; }

  .gate-bars { display: flex; flex-direction: column; gap: 12px; margin: 14px 0; }
  .gate-bar-label { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 5px; }
  .final-banner {
    padding: 15px 18px; border-radius: var(--radius); background: var(--success-light); color: var(--success);
    font-weight: 700; margin-bottom: 16px; border: 1px solid rgba(47, 174, 114, .18);
  }
  .final-banner.warning { background: var(--warning-light); color: var(--warning); border-color: rgba(226, 161, 60, .2); }

  /* ---------- Modal ---------- */
  .modal-overlay {
    position: fixed; inset: 0; background: var(--overlay);
    backdrop-filter: blur(2px);
    display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px;
    animation: fade-in .18s ease;
  }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  .modal-dialog {
    background: var(--surface); border-radius: 16px; width: 100%; max-height: 88vh; overflow-y: auto;
    box-shadow: var(--shadow-modal);
    animation: modal-in .22s cubic-bezier(.22,1,.36,1);
  }
  @keyframes modal-in {
    from { opacity: 0; transform: translateY(10px) scale(.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .modal-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 18px 22px; border-bottom: 1px solid var(--border);
  }
  .modal-header h3 { margin: 0; font-size: 17.5px; font-weight: 800; }
  .modal-close { background: none; color: var(--text-muted); font-size: 21.5px; padding: 2px 6px; border-radius: var(--radius-sm); line-height: 1; }
  .modal-close:hover { background: var(--surface-2); color: var(--text); opacity: 1; }
  .modal-body { padding: 22px; }
  .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }

  /* ---------- Toast ---------- */
  #toast-container { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 200; }
  .toast {
    background: var(--toast-bg); color: #fff; padding: 11px 18px; border-radius: var(--radius-sm); font-size: 15px;
    opacity: 0; transform: translateY(8px); transition: all .25s; max-width: 320px; box-shadow: var(--shadow-hover);
    font-weight: 500;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast-error { background: var(--danger); }
  .toast-success { background: var(--success); }

  .helper-text { font-size: 13.5px; color: var(--text-muted); margin-top: 4px; }
  .divider { border: none; border-top: 1px solid var(--border); margin: 18px 0; }
  fieldset { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px; margin: 0 0 14px; }
  legend { font-size: 14px; font-weight: 700; color: var(--text-muted); padding: 0 6px; }

  @media (max-width: 640px) {
    main { padding: 18px 14px 40px; }
    .navbar { padding: 0 14px; gap: 12px; }
    .login-card { width: 100%; padding: 34px 24px; }
  }
</style>
</head>

<script>
"use strict";

const API_BASE = "/api";

const state = {
  token: sessionStorage.getItem("token") || null,
  user: null,
  currentProjectId: null,
  currentProject: null,
  activeTab: "landowners",
  projectCache: {},
};

/* ================= API helper ================= */

async function api(path, { method = "GET", body, isForm = false, params, silent = false } = {}) {
  let url = API_BASE + path;
  if (params) {
    const entries = Object.entries(params).filter(([, v]) => v !== undefined && v !== null && v !== "");
    if (entries.length) url += "?" + new URLSearchParams(entries).toString();
  }
  const headers = {};
  if (state.token) headers["Authorization"] = "Bearer " + state.token;
  let fetchBody;
  if (isForm) {
    fetchBody = body;
  } else if (body !== undefined) {
    headers["Content-Type"] = "application/json";
    fetchBody = JSON.stringify(body);
  }

  let res;
  try {
    res = await fetch(url, { method, headers, body: fetchBody });
  } catch (err) {
    toast("無法連線到伺服器", "error");
    throw err;
  }

  if (res.status === 401) {
    if (!silent) toast("登入已逾期,請重新登入", "error");
    doLogout();
    throw new Error("unauthorized");
  }

  if (!res.ok) {
    let detail = res.statusText;
    try {
      const data = await res.json();
      detail = typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail || data);
    } catch (e) {}
    if (!silent) toast(detail, "error");
    throw new Error(detail);
  }

  if (res.status === 204) return null;
  const ct = res.headers.get("content-type") || "";
  if (ct.includes("application/json")) return res.json();
  return res;
}

/* ================= Toast ================= */

function toast(message, type = "info") {
  const container = document.getElementById("toast-container");
  const el = document.createElement("div");
  el.className = `toast toast-${type}`;
  el.textContent = message;
  container.appendChild(el);
  requestAnimationFrame(() => el.classList.add("show"));
  setTimeout(() => {
    el.classList.remove("show");
    setTimeout(() => el.remove(), 300);
  }, 3500);
}

/* ================= Modal ================= */

function openModal(title, bodyHtml, { width = "480px" } = {}) {
  const root = document.getElementById("modal-root");
  root.innerHTML = `
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal-dialog" style="max-width:${width}">
        <div class="modal-header">
          <h3>${title}</h3>
          <button class="modal-close" id="modal-close-btn" type="button">&times;</button>
        </div>
        <div class="modal-body">${bodyHtml}</div>
      </div>
    </div>`;
  root.querySelector("#modal-close-btn").onclick = closeModal;
  root.querySelector("#modal-overlay").onclick = (e) => {
    if (e.target.id === "modal-overlay") closeModal();
  };
  return root;
}

function closeModal() {
  document.getElementById("modal-root").innerHTML = "";
}

/* ================= Formatting helpers ================= */

function escapeHtml(str) {
  if (str === null || str === undefined) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function fmtDateTime(iso) {
  if (!iso) return "-";
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleString("zh-TW", { year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
}

function fmtDate(iso) {
  if (!iso) return "-";
  return String(iso).slice(0, 10);
}

function fmtPct(ratio) {
  return (ratio * 100).toFixed(1) + "%";
}

function fmtMoney(n) {
  return Number(n).toLocaleString("zh-TW", { maximumFractionDigits: 0 });
}

/* ================= Theme ================= */

const SUN_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>`;
const MOON_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;

function getEffectiveTheme() {
  const stored = localStorage.getItem("theme");
  if (stored === "light" || stored === "dark") return stored;
  return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}

function renderThemeToggle() {
  const btn = document.getElementById("theme-toggle-btn");
  if (!btn) return;
  // Icon shown = the mode a click will switch TO.
  btn.innerHTML = getEffectiveTheme() === "dark" ? SUN_ICON : MOON_ICON;
}

function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  localStorage.setItem("theme", theme);
  renderThemeToggle();
}

document.getElementById("theme-toggle-btn").addEventListener("click", () => {
  applyTheme(getEffectiveTheme() === "dark" ? "light" : "dark");
});

renderThemeToggle();

/* ================= Auth ================= */

async function doLogin(username, password) {
  const data = await api("/auth/login", { method: "POST", body: { username, password } });
  state.token = data.access_token;
  sessionStorage.setItem("token", state.token);
  await loadCurrentUser();
}

async function loadCurrentUser() {
  const user = await api("/auth/me");
  state.user = user;
  renderNavUser();
  showApp();
  goToDashboard();
}

let loggingOut = false;

async function doLogout() {
  // Reentrancy guard: if the token is already invalid, the /auth/logout call below
  // also gets a 401, whose handler calls doLogout() again - without this guard that
  // recurses (throttled only by network round-trips) instead of terminating.
  if (loggingOut) return;
  loggingOut = true;
  try {
    if (state.token) {
      await api("/auth/logout", { method: "POST", silent: true });
    }
  } catch (err) {
    /* still log out client-side even if the server call fails */
  }
  state.token = null;
  state.user = null;
  state.currentProjectId = null;
  state.projectCache = {};
  sessionStorage.removeItem("token");
  document.getElementById("app").classList.add("hidden");
  document.getElementById("view-login").classList.remove("hidden");
  loggingOut = false;
}

async function loadDashboard() {
  const grid = document.getElementById("project-grid");
  grid.innerHTML = `<div class="empty-state">載入中...</div>`;
  let projects;
  try {
    projects = await api("/projects");
  } catch (e) {
    grid.innerHTML = `<div class="empty-state">載入失敗</div>`;
    return;
  }

  if (!projects.length) {
    grid.innerHTML = `<div class="empty-state">目前沒有可查看的案件</div>`;
    return;
  }

  const enriched = await Promise.all(
    projects.map(async (p) => {
      let ratio = null;
      let alerts = [];
      try {
        ratio = await api(`/projects/${p.id}/consent-ratio`, { silent: true });
      } catch (e) {}
      try {
        alerts = await api(`/projects/${p.id}/alerts`, { silent: true });
      } catch (e) {}
      return { p, ratio, alerts };
    })
  );

  grid.innerHTML = enriched
    .map(({ p, ratio, alerts }) => {
      const pct = Math.round((p.current_stage / 9) * 100);
      const gateBadge =
        ratio && ratio.headcount_total > 0
          ? `<span class="mini-badge ${ratio.dual_gate_passed ? "gate-ok" : ""}">同意度 人數${fmtPct(ratio.headcount_ratio)} / 面積${fmtPct(ratio.land_share_ratio)}</span>`
          : "";
      const alertBadge = alerts.length ? `<span class="mini-badge alert">⚠ ${alerts.length} 位待跟進</span>` : "";
      return `
        <div class="card project-card" data-project-id="${p.id}">
          <div class="project-card-top">
            <div>
              <h3>${escapeHtml(p.name)}</h3>
              <div class="project-code">${escapeHtml(p.project_code)}${p.district ? " · " + escapeHtml(p.district) : ""}</div>
            </div>
            <span class="status-badge status-${p.status}">${PROJECT_STATUS_LABEL[p.status] || p.status}</span>
          </div>
          <div>
            <div class="card-meta-row"><span>SOP 進度</span><span>第 ${p.current_stage} / 9 關</span></div>
            <div class="progress-bar-track"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
          </div>
          <div class="badge-row">${gateBadge}${alertBadge}</div>
          ${
            isAdmin()
              ? `<div style="text-align:right"><button type="button" class="btn-link" style="color:var(--danger)" data-delete-project="${p.id}">刪除案件</button></div>`
              : ""
          }
        </div>`;
    })
    .join("");

  grid.querySelectorAll(".project-card").forEach((card) => {
    card.addEventListener("click", () => openProject(Number(card.dataset.projectId)));
  });

  grid.querySelectorAll("[data-delete-project]").forEach((btn) => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const target = enriched.find((x) => x.p.id === Number(btn.dataset.deleteProject));
      if (target) openDeleteProjectModal(target.p);
    });
  });
}

function openDeleteProjectModal(project) {
  openModal(
    "刪除案件",
    `
    <p style="margin-top:0">此操作將永久刪除案件「${escapeHtml(project.name)}」及其底下所有地主、土地/建物資料、聯絡紀錄、文件、費用與 SOP 進度,且<strong style="color:var(--danger)">無法復原</strong>。</p>
    <p>請輸入案件代碼 <code style="background:var(--bg);padding:2px 6px;border-radius:4px">${escapeHtml(project.project_code)}</code> 以確認刪除:</p>
    <form id="delete-project-form">
      <div class="field"><input name="confirm_code" autocomplete="off" required></div>
      <div class="modal-footer">
        <button type="button" class="btn-secondary" onclick="closeModal()">取消</button>
        <button type="submit" class="btn-danger">永久刪除</button>
      </div>
    </form>`
  );
  document.getElementById("delete-project-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);

      loadDashboard();
    } catch (err) {}
  });
}

async function suggestNextProjectCode() {
  const year = new Date().getFullYear();
  let maxSeq = 0;
  try {
    const projects = await api("/projects", { silent: true });
    const prefix = `${year}-`;
    projects.forEach((p) => {
      if (p.project_code && p.project_code.startsWith(prefix)) {
        const seq = Number(p.project_code.slice(prefix.length));
        if (Number.isFinite(seq) && seq > maxSeq) maxSeq = seq;
      }
    });
  } catch (e) {}
  return `${year}-${String(maxSeq + 1).padStart(3, "0")}`;
}

/* ================= Title deed OCR wizard ================= */

const PING_PER_SQM = 0.3025;
let titleDeedWizard = null;

function openTitleDeedWizard() {
  titleDeedWizard = { files: [], pages: [], step: 0, data: null, activeType: null, activeIndex: null };
  renderWizardStep0();
}

function wizardProgressHtml(label) {
  return `<div class="helper-text" style="margin-bottom:14px">${escapeHtml(label)}</div>`;
}

function normalizeTitleDeedData(raw) {
  raw = raw || {};
  const toLandOwnerRow = (o) => {
    o = o || {};
    return {
      registration_order: o.registration_order || "",
      owner_name: o.owner_name || "",
      id_number: o.id_number || "",
      ownership_numerator: o.ownership_numerator || 1,
      ownership_denominator: o.ownership_denominator || 1,
      address: o.address || "",
    };
  };
  const toBuildingOwnerRow = (o) => {
    o = o || {};
    return {
      registration_order: o.registration_order || "",
      owner_name: o.owner_name || "",
      ownership_numerator: o.ownership_numerator || 1,
      ownership_denominator: o.ownership_denominator || 1,
      address: o.address || "",
    };
  };

  const parcels = (raw.land_parcels || []).map((p) => ({
    township: p.township || "",
    section: p.section || "",
    subsection: p.subsection || "",
    parcel_number: p.parcel_number || "",
    area_sqm: p.area_sqm ?? "",
    owners: (p.owners || []).map(toLandOwnerRow),
  }));

  const buildings = (raw.buildings || []).map((b) => ({
    building_number: b.building_number || "",
    building_address: b.building_address || "",
    parcel_number: b.parcel_number || "",
    total_floors: b.total_floors || "",
    floor: b.floor || "",
    total_area_sqm: b.total_area_sqm ?? "",
    floor_area_sqm: b.floor_area_sqm ?? "",
    owners: (b.owners || []).map(toBuildingOwnerRow),
  }));

  const encumbrances = (raw.encumbrances || []).map((e) => ({
    registration_order: e.registration_order || "",
    applies_to_parcels: e.applies_to_parcels || "",
    right_type: e.right_type || "",
    right_holder: e.right_holder || "",
    debtor_info: e.debtor_info || "",
  }));

  return { parcels, buildings, encumbrances };
}

function renderWizardStep() {
  const steps = {
    1: renderWizardStepOverview,
    2: renderWizardStepParcelEditor,
    3: renderWizardStepBuildingEditor,
    4: renderWizardStepConfirm,
  };
  steps[titleDeedWizard.step]();
}

/* ---- Step 0: upload + reorder ---- */

function renderWizardStep0() {
  openModal(
    "掃描謄本匯入",
    `
    <div class="field">
      <label>選擇謄本圖片或 PDF(可多選;拍照多張時請依謄本頁面順序選取)</label>
      <input type="file" id="wizard-file-input" accept="image/*,application/pdf" multiple>
    </div>
    <div id="wizard-file-list" style="margin-top:10px"></div>
    <div class="helper-text">若有多張照片或多頁,請用下方的 ▲▼ 調整順序,順序需與謄本頁面順序一致</div>
    <div class="modal-footer">
      <button type="button" class="btn-secondary" onclick="closeModal()">取消</button>
      <button type="button" class="btn-secondary" id="wizard-manual-group-btn">手動分組後再辨識</button>
      <button type="button" class="btn-primary" id="wizard-start-ocr-btn">開始辨識</button>
    </div>`,
    { width: "560px" }
  );

  renderWizardFileList();

  document.getElementById("wizard-file-input").addEventListener("change", (e) => {
    titleDeedWizard.files.push(...Array.from(e.target.files));
    e.target.value = "";
    renderWizardFileList();
  });
  document.getElementById("wizard-start-ocr-btn").addEventListener("click", runTitleDeedOcr);
  document.getElementById("wizard-manual-group-btn").addEventListener("click", runTitleDeedSplitAndGroup);
}

function renderWizardFileList() {
  const wrap = document.getElementById("wizard-file-list");
  if (!titleDeedWizard.files.length) {
    wrap.innerHTML = `<div class="helper-text">尚未選擇檔案</div>`;
    return;
  }
  wrap.innerHTML = titleDeedWizard.files
    .map(
      (f, i) => `
      <div class="record-row" style="display:flex;align-items:center;gap:8px;padding:8px 10px;margin-bottom:6px">
        <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${i + 1}. ${escapeHtml(f.name)}</span>
        <button type="button" class="btn-secondary btn-sm" data-move-up="${i}" ${i === 0 ? "disabled" : ""}>▲</button>
        <button type="button" class="btn-secondary btn-sm" data-move-down="${i}" ${
        i === titleDeedWizard.files.length - 1 ? "disabled" : ""
      }>▼</button>
        <button type="button" class="btn-danger btn-sm" data-remove-file="${i}">移除</button>
      </div>`
    )
    .join("");

  wrap.querySelectorAll("[data-move-up]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const i = Number(btn.dataset.moveUp);
      [titleDeedWizard.files[i - 1], titleDeedWizard.files[i]] = [titleDeedWizard.files[i], titleDeedWizard.files[i - 1]];
      renderWizardFileList();
    });
  });
  wrap.querySelectorAll("[data-move-down]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const i = Number(btn.dataset.moveDown);
      [titleDeedWizard.files[i + 1], titleDeedWizard.files[i]] = [titleDeedWizard.files[i], titleDeedWizard.files[i + 1]];
      renderWizardFileList();
    });
  });
  wrap.querySelectorAll("[data-remove-file]").forEach((btn) => {
    btn.addEventListener("click", () => {
      titleDeedWizard.files.splice(Number(btn.dataset.removeFile), 1);
      renderWizardFileList();
    });
  });
}

async function runTitleDeedOcr() {
  if (!titleDeedWizard.files.length) {
    toast("請先選擇至少一個檔案", "error");
    return;
  }
  const btn = document.getElementById("wizard-start-ocr-btn");
  btn.disabled = true;
  btn.textContent = "辨識中(頁數多的批次謄本可能需要數分鐘,請耐心等候、勿關閉視窗)...";
  try {
    const fd = new FormData();
    titleDeedWizard.files.forEach((f) => fd.append("files", f));
    const result = await api(`/projects/${state.currentProjectId}/ocr/title-deed`, { method: "POST", body: fd, isForm: true });

    if (result.job.status !== "completed") {
      toast(result.job.error_message || "辨識失敗,請手動輸入各欄位", "error");
      titleDeedWizard.data = normalizeTitleDeedData(null);
    } else if (result.job.error_message) {
      // Completed, but part of a multi-chunk batch failed - the rest of the data is
      // still usable, just possibly incomplete.
      toast(result.job.error_message, "error");
      titleDeedWizard.data = normalizeTitleDeedData(result.data);
    } else {
      titleDeedWizard.data = normalizeTitleDeedData(result.data);
      toast("辨識完成,請逐步核對每個區塊", "success");
    }
    titleDeedWizard.step = 1;
    renderWizardStep();
  } catch (err) {
    btn.disabled = false;
    btn.textContent = "開始辨識";
  }
}

/* ---- Manual grouping: split every page first, let the user mark which pages belong
   together (one 地號/建號's pages), then OCR each group separately instead of letting
   the model guess where the boundaries are across a mixed batch. ---- */

function base64ToBlob(base64, mime) {
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new Blob([bytes], { type: mime });
}

async function runTitleDeedSplitAndGroup() {
  if (!titleDeedWizard.files.length) {
    toast("請先選擇至少一個檔案", "error");
    return;
  }
  const btn = document.getElementById("wizard-manual-group-btn");
  btn.disabled = true;
  btn.textContent = "拆解頁面中...";
  try {
    const fd = new FormData();
    titleDeedWizard.files.forEach((f) => fd.append("files", f));
    const pages = await api(`/projects/${state.currentProjectId}/ocr/split-pages`, { method: "POST", body: fd, isForm: true });
    titleDeedWizard.pages = pages.map((p) => ({ ...p, group: 1 }));
    renderWizardStepGrouping();
  } catch (err) {
    btn.disabled = false;
    btn.textContent = "手動分組後再辨識";
  }
}

function renderWizardStepGrouping() {
  const pages = titleDeedWizard.pages;
  openModal(
    "掃描謄本匯入 · 手動分組",
    `
    <div class="helper-text" style="margin-bottom:10px">
      每張縮圖下方填「分組編號」,同一編號的頁面會合成一組一起送出辨識,不同組會分開各自辨識,避免不同地號/建號的內容被混在一起。預設全部是第 1 組。
    </div>
    <div id="wizard-page-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;max-height:420px;overflow-y:auto;padding:4px"></div>
    <div class="modal-footer">
      <button type="button" class="btn-secondary" onclick="renderWizardStep0()">上一步</button>
      <button type="button" class="btn-primary" id="wizard-grouped-ocr-btn">開始辨識</button>
    </div>`,
    { width: "700px" }
  );

  const grid = document.getElementById("wizard-page-grid");
  grid.innerHTML = pages
    .map(
      (p, i) => `
      <div class="record-row" style="padding:6px;text-align:center">
        <img src="data:${p.mime_type};base64,${p.image_base64}" style="width:100%;height:110px;object-fit:cover;border-radius:4px;border:1px solid var(--border)">
        <div class="helper-text" style="margin:4px 0 2px">第 ${p.page_number} 頁</div>
        <input type="number" min="1" value="${p.group}" data-page-group="${i}" style="width:100%;text-align:center" autocomplete="off">
      </div>`
    )
    .join("");

  grid.querySelectorAll("[data-page-group]").forEach((input) => {
    input.addEventListener("change", () => {
      const i = Number(input.dataset.pageGroup);
      titleDeedWizard.pages[i].group = Math.max(1, Number(input.value) || 1);
      input.value = titleDeedWizard.pages[i].group;
    });
  });

  document.getElementById("wizard-grouped-ocr-btn").addEventListener("click", runGroupedTitleDeedOcr);
}

async function runGroupedTitleDeedOcr() {
  const btn = document.getElementById("wizard-grouped-ocr-btn");
  btn.disabled = true;

  const groupNumbers = [...new Set(titleDeedWizard.pages.map((p) => p.group))].sort((a, b) => a - b);
  const combined = { parcels: [], buildings: [], encumbrances: [] };
  const failedGroups = [];

  try {
    for (let g = 0; g < groupNumbers.length; g++) {
      const groupNumber = groupNumbers[g];
      btn.textContent = `辨識中(第 ${g + 1}/${groupNumbers.length} 組)...`;
      const groupPages = titleDeedWizard.pages.filter((p) => p.group === groupNumber);
      const fd = new FormData();
      groupPages.forEach((p, i) => fd.append("files", base64ToBlob(p.image_base64, p.mime_type), `page-${p.page_number}.png`));

      try {
        const result = await api(`/projects/${state.currentProjectId}/ocr/title-deed`, { method: "POST", body: fd, isForm: true });
        if (result.job.status !== "completed") {
          failedGroups.push(groupNumber);
          continue;
        }
        if (result.job.error_message) failedGroups.push(groupNumber);
        const normalized = normalizeTitleDeedData(result.data);
        combined.parcels.push(...normalized.parcels);
        combined.buildings.push(...normalized.buildings);
        combined.encumbrances.push(...normalized.encumbrances);
      } catch (err) {
        failedGroups.push(groupNumber);
      }
    }

    titleDeedWizard.data = combined;
    if (failedGroups.length) {
      toast(`第 ${failedGroups.join("、")} 組辨識失敗或不完整,請手動核對補充`, "error");
    } else {
      toast("分組辨識完成,請逐步核對每個區塊", "success");
    }
    titleDeedWizard.step = 1;
    renderWizardStep();
  } catch (err) {
    btn.disabled = false;
    btn.textContent = "開始辨識";
  }
}

function ownerRowHtml(prefix, o, areaSqm) {
  const numerator = o.ownership_numerator || 1;
  const denominator = o.ownership_denominator || 1;
  let areaHelper = "";
  if (areaSqm) {
    const ownedSqm = (areaSqm * numerator) / denominator;
    const ownedPing = ownedSqm * PING_PER_SQM;
    areaHelper = `
      <div class="field-row">
        <div class="field">
          <label>持分面積(m²)</label>
          <div style="padding:9px 11px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);font-weight:600">${ownedSqm.toFixed(2)}</div>
        </div>
        <div class="field">
          <label>持分面積(坪)</label>
          <div style="padding:9px 11px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);font-weight:600">${ownedPing.toFixed(3)}</div>
        </div>
      </div>`;
  }
  return `
    <div class="field-row">
      <div class="field"><label>登記次序</label><input class="${prefix}-order" value="${escapeHtml(o.registration_order)}" autocomplete="off"></div>
      <div class="field"><label>所有權人姓名</label><input class="${prefix}-name" value="${escapeHtml(o.owner_name)}" autocomplete="off"></div>
    </div>
    ${
      "id_number" in o
        ? `<div class="field"><label>統一編號</label><input class="${prefix}-idnum" value="${escapeHtml(o.id_number)}" autocomplete="off"></div>`
        : ""
    }
    <div class="field-row">
      <div class="field"><label>權利範圍(分子)</label><input class="${prefix}-num" type="number" value="${numerator}" autocomplete="off"></div>
      <div class="field"><label>權利範圍(分母)</label><input class="${prefix}-den" type="number" value="${denominator}" autocomplete="off"></div>
    </div>
    ${areaHelper}
    <div class="field"><label>戶籍地址</label><input class="${prefix}-address" value="${escapeHtml(o.address)}" autocomplete="off"></div>
    <button type="button" class="btn-link btn-sm remove-wizard-row-btn">刪除此筆</button>`;
}

function renderOwnerRowsContainer(containerId, owners, prefix, areaSqm) {
  const wrap = document.getElementById(containerId);
  wrap.innerHTML = owners.map((o) => `<div class="record-row wizard-row">${ownerRowHtml(prefix, o, areaSqm)}</div>`).join("");
  wrap.querySelectorAll(".remove-wizard-row-btn").forEach((btn) => {

function readOwnerRowsContainer(containerId, prefix) {
  return [...document.querySelectorAll(`#${containerId} .wizard-row`)]
    .map((row) => {
      const obj = {
        registration_order: row.querySelector(`.${prefix}-order`).value.trim(),
        owner_name: row.querySelector(`.${prefix}-name`).value.trim(),
        ownership_numerator: Number(row.querySelector(`.${prefix}-num`).value) || 1,
        ownership_denominator: Number(row.querySelector(`.${prefix}-den`).value) || 1,
        address: row.querySelector(`.${prefix}-address`).value.trim(),

    <div class="helper-text" style="margin-top:12px">確認無誤後點「建立」,系統會自動比對/建立地主,並寫入土地、建物、他項權利資料。同一人若出現在多筆地號/建號,只會建立一筆地主。</div>
    <div class="modal-footer">
      <button type="button" class="btn-secondary" id="wizard-prev-btn">上一步</button>
      <button type="button" class="btn-primary" id="wizard-confirm-btn">建立</button>
    </div>`,
    { width: "620px" }
  );

  document.getElementById("wizard-prev-btn").addEventListener("click", () => {

  });

}

async function findOrCreateLandownerByOwner(owner, createdCache) {
  const pid = state.currentProjectId;
  const idKey = (owner.id_number || "").trim();
  const nameKey = owner.owner_name.trim();
  const cacheKey = idKey || `name:${nameKey}`;
  if (createdCache.has(cacheKey)) return createdCache.get(cacheKey);

  const existingList = state.projectCache[pid].landowners;
  let existing = null;
  if (idKey) existing = existingList.find((o) => o.id_number && o.id_number === idKey);
  if (!existing) existing = existingList.find((o) => o.name === nameKey);

  let landownerId;
  if (existing) {
    landownerId = existing.id;
  } else {
    const created = await api(`/projects/${pid}/landowners`, {
      method: "POST",
      body: {
        name: nameKey,
        id_number: idKey || null,
        address: owner.address || null,
        land_records: [],
        building_records: [],
      },
    });
    landownerId = created.id;
    existingList.push(created);
  }
  createdCache.set(cacheKey, landownerId);
  return landownerId;
}

async function submitTitleDeedWizard() {
  const d = titleDeedWizard.data;

  const badParcelIndex = d.parcels.findIndex((p) => p.owners.some((o) => o.owner_name) && !p.parcel_number);
  if (badParcelIndex !== -1) {
    toast(`第 ${badParcelIndex + 1} 筆地號缺少地號欄位,請返回編輯`, "error");
    titleDeedWizard.activeType = "parcel";
    titleDeedWizard.activeIndex = badParcelIndex;
    titleDeedWizard.step = 2;
    renderWizardStep();
    return;
  }

  const btn = document.getElementById("wizard-confirm-btn");
  btn.disabled = true;
  btn.textContent = "建立中...";
  const pid = state.currentProjectId;
  const createdCache = new Map();
  // Links a building record to the land record for the SAME owner on the matching
  // 地號 (building.parcel_number), so 建物標示部's "地號" field isn't just descriptive
  // text - it actually connects the two records in the data model.
  const landRecordIdByParcelOwner = new Map();
  const parcelOwnerKey = (parcelNumber, landownerId) => `${(parcelNumber || "").trim()}::${landownerId}`;

  try {
    if (!state.projectCache[pid]) state.projectCache[pid] = {};
    if (!state.projectCache[pid].landowners) {
      state.projectCache[pid].landowners = await api(`/projects/${pid}/landowners`);
    }

    // Seed from land records that already exist in the project (e.g. from an earlier
    // wizard run that only scanned the 土地謄本) - otherwise a building-only run today
    // would never find a match, since it'd only ever look at parcels created in this
    // same submission.
    for (const owner of state.projectCache[pid].landowners) {
      for (const lr of owner.land_records || []) {
        landRecordIdByParcelOwner.set(parcelOwnerKey(lr.parcel_number, owner.id), lr.id);
      }
    }

    for (const p of d.parcels) {
      for (const owner of p.owners) {
        if (!owner.owner_name) continue;
        const landownerId = await findOrCreateLandownerByOwner(owner, createdCache);
        const created = await api(`/projects/${pid}/landowners/${landownerId}/land-records`, {
          method: "POST",
          body: {
            parcel_number: p.parcel_number,
            township: p.township || null,
            section: p.section || null,
            subsection: p.subsection || null,
            registration_order: owner.registration_order || null,
            total_area_sqm: Number(p.area_sqm) || 0,
            ownership_numerator: owner.ownership_numerator || 1,
            ownership_denominator: owner.ownership_denominator || 1,
          },
        });
        landRecordIdByParcelOwner.set(parcelOwnerKey(p.parcel_number, landownerId), created.id);
      }
    }

    for (const enc of d.encumbrances) {
      if (!enc.right_type && !enc.right_holder) continue;
      await api(`/projects/${pid}/encumbrances`, { method: "POST", body: enc });
    }

    for (const b of d.buildings) {
      const floorAreaSqm = Number(b.total_area_sqm) || Number(b.floor_area_sqm) || 0;
      for (const owner of b.owners) {
        if (!owner.owner_name) continue;
        const landownerId = await findOrCreateLandownerByOwner(owner, createdCache);
        await api(`/projects/${pid}/landowners/${landownerId}/building-records`, {
          method: "POST",
          body: {
            land_record_id: landRecordIdByParcelOwner.get(parcelOwnerKey(b.parcel_number, landownerId)) || null,
            building_number: b.building_number || null,
            address: b.building_address || null,
            floor: b.floor || null,
            total_floors: b.total_floors || null,
            registration_order: owner.registration_order || null,
            structure_area_sqm: floorAreaSqm,
            auxiliary_area_sqm: 0,
            common_area_sqm: 0,
            ownership_numerator: owner.ownership_numerator || 1,
            ownership_denominator: owner.ownership_denominator || 1,
          },
        });
      }
    }

    closeModal();
    toast("謄本資料已匯入", "success");
    titleDeedWizard = null;
    renderTab("landowners");
  } catch (err) {
    btn.disabled = false;
    btn.textContent = "建立";
  }
}

const DUAL_GATE_STAGES = [4, 8, 9];

async function renderSopTab(el) {
  const pid = state.currentProjectId;
  const sop = await api(`/projects/${pid}/sop`);
  state.projectCache[pid].sop = sop;

  const stageKeys = Object.keys(sop.stages).sort((a, b) => Number(a) - Number(b));

  let finalBanner = "";
  if (sop.final.status === "completed") {
    finalBanner = `<div class="final-banner">✓ 案件已 100% 同意結案${sop.final.closed_at ? "(" + fmtDateTime(sop.final.closed_at) + ")" : ""}</div>`;
  } else if (sop.final.status === "force_closed") {
    finalBanner = `<div class="final-banner warning">案件已由主管強制結案${sop.final.reason ? ":" + escapeHtml(sop.final.reason) : ""}</div>`;
  }

  const stepper = stageKeys
    .map((key) => {
      const stage = sop.stages[key];
      const num = Number(key);
      const cls = stage.status === "completed" ? "completed" : stage.status === "force_closed" ? "force_closed" : num === sop.current_stage ? "current" : "";
      return `<div class="sop-node ${cls}"><div class="line"></div><div class="circle">${key}</div><div class="label">${escapeHtml(stage.name.split(":")[1] || stage.name)}</div></div>`;
    })
    .join("");

  const currentStage = sop.stages[String(sop.current_stage)];
  const isFinished = sop.final.status !== "pending";

  let actionPanel = "";
  if (!isFinished && currentStage) {
    const isDualGate = DUAL_GATE_STAGES.includes(sop.current_stage);
    actionPanel = `
      <div class="card">
        <h3 style="margin-top:0">目前關卡:${escapeHtml(currentStage.name)}</h3>
        ${isDualGate ? `<div id="consent-panel"></div>` : ""}
        ${
          isEditor()
            ? `<div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">
                <button class="btn-primary" id="complete-stage-btn">完成本關卡</button>
                ${isAdmin() ? `<button class="btn-warning" id="force-stage-btn">主管強制完成</button>` : ""}
              </div>`
            : ""
        }
      </div>`;
  }

  let forceCloseSection = "";
  if (isAdmin() && !isFinished) {
    forceCloseSection = `
      <div class="card" style="margin-top:16px">
        <h3 style="margin-top:0">主管操作</h3>
        <button class="btn-danger btn-sm" id="force-close-project-btn">強制結案</button>
      </div>`;
  }

  el.innerHTML = `
    ${finalBanner}
    <div class="sop-stepper">${stepper}</div>
    ${actionPanel}
    ${forceCloseSection}
  `;

  if (currentStage && DUAL_GATE_STAGES.includes(sop.current_stage) && !isFinished) {
    await renderConsentPanel(document.getElementById("consent-panel"), sop.current_stage);
  }

  const completeBtn = document.getElementById("complete-stage-btn");
  if (completeBtn) {
    completeBtn.addEventListener("click", async () => {
      try {
        await api(`/projects/${pid}/sop/${sop.current_stage}/complete`, { method: "POST", body: {} });
        toast("關卡已完成", "success");
        await loadDashboard();
        renderTab("sop");
      } catch (err) {}
    });
  }
  const forceBtn = document.getElementById("force-stage-btn");
  if (forceBtn) {
    forceBtn.addEventListener("click", async () => {
      const reason = prompt("請輸入強制完成原因:");
      if (reason === null) return;
      try {
        await api(`/projects/${pid}/sop/${sop.current_stage}/complete`, { method: "POST", body: { force: true, reason } });
        toast("已強制完成關卡", "success");
        renderTab("sop");
      } catch (err) {}
    });
  }
  const forceCloseBtn = document.getElementById("force-close-project-btn");
  if (forceCloseBtn) {
    forceCloseBtn.addEventListener("click", async () => {
      const reason = prompt("請輸入強制結案原因:");
      if (reason === null) return;
      try {
        await api(`/projects/${pid}/sop/force-close`, { method: "POST", body: { force: true, reason } });
        toast("案件已強制結案", "success");
        await loadDashboard();
        renderTab("sop");
      } catch (err) {}
    });
  }
}

async function renderConsentPanel(el, stage) {

        <div class="progress-bar-track"><div class="progress-bar-fill" style="width:${Math.min(ratio.land_share_ratio * 100, 100)}%"></div></div>
      </div>
      <div class="helper-text">需人數與面積同意率皆 ≥ 80% 才能通過雙門檻${ratio.dual_gate_passed ? " · <strong style='color:var(--success)'>已達標</strong>" : ""}</div>
    </div>
    ${
      isEditor()
        ? `<div class="table-wrap">
            <table>
              <thead><tr><th>地主</th><th>本輪同意狀態</th><th>操作</th></tr></thead>
              <tbody>
                ${landowners
                  .map((o) => {
                    const rec = recordByLandowner[o.id];
                    const status = rec ? rec.consent_status : "pending";
                    return `<tr>
                      <td>${escapeHtml(o.name)}</td>
                      <td><span class="consent-status-badge cs-${status}">${CONSENT_STATUS_LABEL[status]}</span></td>
                      <td class="actions-cell">

                      </td>
                    </tr>`;
                  })

              </tbody>
            </table>
          </div>`
        : ""
    }
  `;

  el.querySelectorAll("[data-consent]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      try {
        await api(`/projects/${pid}/sop/${stage}/consent`, {
          method: "POST",
          body: { landowner_id: Number(btn.dataset.consent), consent_status: btn.dataset.status },
        });

        renderTab("sop");
      } catch (err) {}
    });
  });

async function downloadDocument(docId, fileName) {
  try {
    const res = await api(`/projects/${state.currentProjectId}/documents/${docId}/download`);
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  } catch (err) {}
}

function openUploadDocumentModal() {
  const landowners = state.projectCache[state.currentProjectId]?.landowners || [];
  openModal(
    "上傳文件",
    `

      <div class="field"><label>檔案</label><input type="file" name="file" required></div>

      <div class="modal-footer">
        <button type="button" class="btn-secondary" onclick="closeModal()">取消</button>
        <button type="submit" class="btn-primary">上傳</button>
      </div>
    </form>`
  );
  document.getElementById("upload-form").addEventListener("submit", async (e) => {

      renderTab("documents");

  });
}

async function renderExpensesTab(el) {
  const pid = state.currentProjectId;
  const [expenses, summary, categories] = await Promise.all([
    api(`/projects/${pid}/expenses`),
    api(`/projects/${pid}/expenses/summary`),
    api(`/expense-categories`),
  ]);
  state.projectCache[pid].categories = categories;
  const catById = Object.fromEntries(categories.map((c) => [c.id, c.name]));

  el.innerHTML = `
    <div class="card" style="margin-bottom:16px">
      <h3 style="margin-top:0">支出統計</h3>
      <div style="font-size: 23.5px;font-weight:700;margin-bottom:10px">NT$ ${fmtMoney(summary.total_amount)}</div>
      ${summary.by_category
        .map(
          (c) => `
        <div class="card-meta-row" style="margin-bottom:4px">
          <span>${escapeHtml(c.category_name) || "未分類"}</span><span>NT$ ${fmtMoney(c.total_amount)}</span>
        </div>`
        )
        .join("")}
    </div>
    <div class="section-toolbar">
      <h3>支出明細 (${expenses.length})</h3>
      <div style="display:flex;gap:10px">
        ${isAdmin() ? `<button class="btn-secondary btn-sm" id="manage-categories-btn">管理類別</button>` : ""}
        ${isEditor() ? `<button class="btn-primary btn-sm" id="add-expense-btn">+ 新增支出</button>` : ""}
      </div>
    </div>
    ${
      expenses.length
        ? `<div class="table-wrap">
            <table>
              <thead><tr><th>日期</th><th>類別</th><th>金額</th><th>廠商</th><th>說明</th>${isEditor() ? "<th>操作</th>" : ""}</tr></thead>
              <tbody>
                ${expenses
                  .map(
                    (ex) => `<tr>
                      <td>${fmtDate(ex.expense_date)}</td>
                      <td>${escapeHtml(catById[ex.category_id]) || "-"}</td>
                      <td>NT$ ${fmtMoney(ex.amount)}</td>
                      <td>${escapeHtml(ex.vendor) || "-"}</td>
                      <td>${escapeHtml(ex.description) || "-"}</td>
                      ${
                        isEditor()
                          ? `<td class="actions-cell">
                              <button class="btn-danger btn-sm" data-delete-expense="${ex.id}">刪除</button>
                            </td>`
                          : ""
                      }
                    </tr>`
                  )
                  .join("")}
              </tbody>
            </table>
          </div>`
        : `<div class="empty-state">尚無支出紀錄</div>`
    }
  `;

  el.querySelectorAll("[data-delete-expense]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      if (!confirm("確定要刪除此筆支出嗎?")) return;
      try {
        await api(`/projects/${pid}/expenses/${btn.dataset.deleteExpense}`, { method: "DELETE" });
        toast("已刪除", "success");
        renderTab("expenses");
      } catch (err) {}
    });
  });
  const addBtn = document.getElementById("add-expense-btn");
  if (addBtn) addBtn.addEventListener("click", () => openAddExpenseModal(categories));
  const manageBtn = document.getElementById("manage-categories-btn");
  if (manageBtn) manageBtn.addEventListener("click", () => openManageCategoriesModal(categories));
}

function openAddExpenseModal(categories) {
  openModal(
    "新增支出",
    `
    <form id="expense-form">
      <div class="field-row">
        <div class="field"><label>日期</label><input type="date" name="expense_date" value="${new Date().toISOString().slice(0, 10)}" required></div>
        <div class="field"><label>金額</label><input type="number" name="amount" step="0.01" required></div>
      </div>
      <div class="field-row">
        <div class="field"><label>類別</label>
          <select name="category_id">
            <option value="">— 未分類 —</option>
            ${categories.map((c) => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join("")}
          </select>
        </div>
        <div class="field"><label>廠商</label><input name="vendor"></div>
      </div>
      <div class="field"><label>說明</label><textarea name="description" rows="2"></textarea></div>
      <div class="modal-footer">
        <button type="button" class="btn-secondary" onclick="closeModal()">取消</button>
        <button type="submit" class="btn-primary">新增</button>
      </div>
    </form>`
  );
  document.getElementById("expense-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const data = Object.fromEntries(fd.entries());
    const payload = {
      category_id: data.category_id ? Number(data.category_id) : null,
      amount: Number(data.amount),
      expense_date: data.expense_date,
      vendor: data.vendor || null,
      description: data.description || null,
    };
    try {
      await api(`/projects/${state.currentProjectId}/expenses`, { method: "POST", body: payload });
      closeModal();
      toast("支出已新增", "success");
      renderTab("expenses");
    } catch (err) {}
  });
}

function openManageCategoriesModal(categories) {
  function renderList(cats) {
    return cats
      .map(
        (c) => `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border)">
          <span>${escapeHtml(c.name)} ${!c.is_active ? '<span class="mini-badge">已停用</span>' : ""}</span>
          <div class="actions-cell">
            <button class="btn-secondary btn-sm" data-toggle-cat="${c.id}" data-active="${c.is_active}">${c.is_active ? "停用" : "啟用"}</button>
            <button class="btn-danger btn-sm" data-delete-cat="${c.id}">刪除</button>
          </div>
        </div>`
      )
      .join("");
  }

  openModal(
    "管理費用類別",
    `
    <div id="category-list">${renderList(categories)}</div>
    <form id="new-category-form" style="margin-top:16px;display:flex;gap:8px">
      <input name="name" placeholder="新增類別名稱" required style="flex:1">
      <button type="submit" class="btn-primary btn-sm">新增</button>
    </form>
    `
  );

  async function refresh() {
    const cats = await api(`/expense-categories`);
    document.getElementById("category-list").innerHTML = renderList(cats);
    wireButtons();
  }

  function wireButtons() {
    document.querySelectorAll("[data-toggle-cat]").forEach((btn) => {
      btn.onclick = async () => {
        const isActive = btn.dataset.active === "true";
        try {
          await api(`/expense-categories/${btn.dataset.toggleCat}`, { method: "PATCH", body: { is_active: !isActive } });
          await refresh();
        } catch (err) {}
      };
    });
    document.querySelectorAll("[data-delete-cat]").forEach((btn) => {
      btn.onclick = async () => {
        if (!confirm("確定要刪除此類別嗎?")) return;
        try {
          await api(`/expense-categories/${btn.dataset.deleteCat}`, { method: "DELETE" });
          await refresh();
        } catch (err) {}
      };
    });
  }
  wireButtons();

  document.getElementById("new-category-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    try {
      await api(`/expense-categories`, { method: "POST", body: { name: fd.get("name") } });
      e.target.reset();
      await refresh();
    } catch (err) {}
  });
}

/* ================= Users ================= */

async function goToUsers() {
  setActiveNav("users");
  showView("view-users");
  await loadUsers();
}

async function loadUsers() {
  const wrap = document.getElementById("users-table-wrap");
  wrap.innerHTML = `<div class="empty-state">載入中...</div>`;
  const users = await api("/users");
  const roleLabel = { admin: "主管", staff: "開發人員", public: "地主" };

  wrap.innerHTML = `
    <table>
      <thead><tr><th>帳號</th><th>顯示名稱</th><th>角色</th><th>Email</th><th>狀態</th><th>操作</th></tr></thead>
      <tbody>
        ${users
          .map(
            (u) => `<tr>
              <td>${escapeHtml(u.username)}</td>
              <td>${escapeHtml(u.display_name)}</td>
              <td><span class="role-badge ${u.role}">${roleLabel[u.role] || u.role}</span></td>
              <td>${escapeHtml(u.email) || "-"}</td>
              <td><span class="mini-badge ${u.is_active ? "gate-ok" : "alert"}">${u.is_active ? "啟用" : "停用"}</span></td>
              <td class="actions-cell">
                <button class="btn-secondary btn-sm" data-edit-user="${u.id}">編輯</button>
                <button class="btn-secondary btn-sm" data-toggle-user="${u.id}" data-active="${u.is_active}">${u.is_active ? "停用" : "啟用"}</button>
                <button class="btn-danger btn-sm" data-delete-user="${u.id}">刪除</button>
              </td>
            </tr>`
          )
          .join("")}
      </tbody>
    </table>`;

  wrap.querySelectorAll("[data-edit-user]").forEach((btn) => {
    btn.addEventListener("click", () => openEditUserModal(users.find((u) => u.id === Number(btn.dataset.editUser))));
  });
  wrap.querySelectorAll("[data-toggle-user]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const isActive = btn.dataset.active === "true";
      try {
        await api(`/users/${btn.dataset.toggleUser}/active`, { method: "PATCH", body: { is_active: !isActive } });
        toast("已更新狀態", "success");
        loadUsers();
      } catch (err) {}
    });
  });
  wrap.querySelectorAll("[data-delete-user]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      if (!confirm("確定要刪除此使用者嗎?")) return;
      try {
        await api(`/users/${btn.dataset.deleteUser}`, { method: "DELETE" });
        toast("已刪除", "success");
        loadUsers();
      } catch (err) {}
    });
  });
}

/* ================= Login logs ================= */

async function goToLoginLogs() {
  setActiveNav("loginlogs");
  showView("view-loginlogs");
  await loadLoginLogs();
}

async function loadLoginLogs() {
  const wrap = document.getElementById("loginlogs-table-wrap");
  wrap.innerHTML = `<div class="empty-state">載入中...</div>`;
  const logs = await api("/auth/login-logs");
  const roleLabel = { admin: "主管", staff: "開發人員", public: "地主" };
  const actionLabel = { login: "登入", logout: "登出" };

  if (!logs.length) {
    wrap.outerHTML = `<div class="empty-state">尚無登入紀錄</div>`;
    return;
  }

  wrap.innerHTML = `
    <table>
      <thead><tr><th>使用者</th><th>角色</th><th>動作</th><th>時間</th><th>IP 位址</th></tr></thead>
      <tbody>
        ${logs
          .map(
            (l) => `<tr>
              <td>${escapeHtml(l.display_name)} <span class="project-code">(${escapeHtml(l.username)})</span></td>
              <td><span class="role-badge ${l.role}">${roleLabel[l.role] || l.role}</span></td>
              <td><span class="consent-status-badge ${l.action === "login" ? "cs-agreed" : "cs-pending"}">${actionLabel[l.action] || l.action}</span></td>
              <td>${fmtDateTime(l.occurred_at)}</td>
              <td>${escapeHtml(l.ip_address) || "-"}</td>
            </tr>`
          )
          .join("")}
      </tbody>
    </table>`;
}

document.getElementById("new-user-btn").addEventListener("click", () => {
  openModal(
    "新增使用者",
    `
    <form id="user-form">
      <div class="field-row">
        <div class="field"><label>帳號</label><input name="username" required></div>
        <div class="field"><label>密碼</label><input name="password" type="password" required></div>
      </div>
      <div class="field-row">
        <div class="field"><label>顯示名稱</label><input name="display_name" required></div>
        <div class="field"><label>角色</label>
          <select name="role">
            <option value="staff">開發人員</option>
            <option value="admin">主管</option>
            <option value="public">地主</option>
          </select>
        </div>
      </div>
      <div class="field-row">
        <div class="field"><label>Email</label><input name="email" type="email"></div>
        <div class="field"><label>電話</label><input name="phone"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-secondary" onclick="closeModal()">取消</button>
        <button type="submit" class="btn-primary">建立</button>
      </div>
    </form>`
  );
  document.getElementById("user-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const payload = Object.fromEntries(fd.entries());
    try {
      await api("/users", { method: "POST", body: payload });
      closeModal();
      toast("使用者已建立", "success");
      loadUsers();
    } catch (err) {}
  });
});

function openEditUserModal(user) {
  openModal(
    "編輯使用者",
    `
    <form id="user-edit-form">
      <div class="field-row">
        <div class="field"><label>顯示名稱</label><input name="display_name" value="${escapeHtml(user.display_name)}" required></div>
        <div class="field"><label>角色</label>
          <select name="role">
            <option value="staff" ${user.role === "staff" ? "selected" : ""}>開發人員</option>
            <option value="admin" ${user.role === "admin" ? "selected" : ""}>主管</option>
            <option value="public" ${user.role === "public" ? "selected" : ""}>地主</option>
          </select>
        </div>
      </div>
      <div class="field-row">
        <div class="field"><label>Email</label><input name="email" type="email" value="${escapeHtml(user.email) || ""}"></div>
        <div class="field"><label>電話</label><input name="phone" value="${escapeHtml(user.phone) || ""}"></div>
      </div>
      <div class="field"><label>新密碼(留空表示不變更)</label><input name="password" type="password"></div>
      <div class="modal-footer">
        <button type="button" class="btn-secondary" onclick="closeModal()">取消</button>
        <button type="submit" class="btn-primary">儲存</button>
      </div>
    </form>`
  );
  document.getElementById("user-edit-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const payload = Object.fromEntries(fd.entries());
    if (!payload.password) delete payload.password;
    try {
      await api(`/users/${user.id}`, { method: "PATCH", body: payload });
      closeModal();
      toast("已更新", "success");
      loadUsers();
    } catch (err) {}
  });
}

  if (state.token) {
    try {
      await loadCurrentUser();
      return;
    } catch (e) {
      /* fall through to login */
    }
  }
  document.getElementById("view-login").classList.remove("hidden");
})();
</script>
