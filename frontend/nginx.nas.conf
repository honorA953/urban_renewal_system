# NAS variant of nginx.conf - listens on 8090 and proxies to the api container over
# loopback (both containers run network_mode: host on this NAS - see
# docker-compose.nas.yml for why). Port 8090 was chosen after checking `netstat -tlnp`
# on this NAS - it already has a lot of other stuff running (old app on 8000, phpMyAdmin
# on 8081, various docker-proxy'd services on 3000/3306/8088/8089/9443/etc.), so don't
# assume a "nice round" port is free here - always check first.

server {
    listen 8090;
    server_name _;

    client_max_body_size 100M;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Batch title deed OCR (backend/utils/ocr.py) processes large uploads in
        # sequential chunks of a few pages each - a big batch can take several minutes
        # end-to-end, well beyond a typical API's response time.
        proxy_read_timeout 1200s;
    }
}
