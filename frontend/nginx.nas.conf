# NAS variant of nginx.conf - listens on 8081 (not 80, which DSM already occupies) and
# proxies to the api container over loopback (both containers run network_mode: host
# on this NAS - see docker-compose.nas.yml for why).

server {
    listen 8081;
    server_name _;

    client_max_body_size 50M;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
