# NAS deployment (Synology) - separate from docker-compose.yml used for local dev.
#
# Differences from the local compose file, all driven by quirks documented in
# 後端開發_CLAUDE.md for this specific NAS:
#   - No mariadb service: connects over TCP to a dedicated "urban_renewal" database on
#     a MariaDB container already running on this NAS (host 192.168.0.20, port 13306 -
#     a deliberately/explicitly mapped port for that container, unlike host port 3306
#     which is hijacked by an unrelated abandoned container on this NAS - see
#     後端開發_CLAUDE.md for that whole saga). Dedicated user, not root, not another
#     app's credentials.
#   - api and nginx both use network_mode: host, because bridge networking is broken on
#     this NAS (bridge-to-bridge and bridge-to-host traffic hits a broken iptables
#     FORWARD chain).
#   - api's port is overridden to 8001 (not the Dockerfile's default 8000) because the
#     existing old system already binds host port 8000 via network_mode: host.
#   - build.network: host, because the bridge network can't reach PyPI during `pip
#     install` on this NAS.
#
# Run with: sudo docker compose -p urban_renewal_new -f docker-compose.nas.yml --env-file .env.nas up -d --build

name: urban_renewal_new

services:
  api:
    build:
      context: ./backend
      network: host
    network_mode: "host"
    restart: unless-stopped
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES}
      UPLOAD_DIR: /app/uploads
      CORS_ORIGINS: ${CORS_ORIGINS}
      ALERT_UNCONTACTED_DAYS: ${ALERT_UNCONTACTED_DAYS}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      OCR_PROVIDER: ${OCR_PROVIDER:-gemini}
      # network_mode: host means this container shares the NAS's own network stack, so
      # (unlike the local docker-compose.yml) there's no host.docker.internal alias to
      # fall back to - OLLAMA_BASE_URL has to be the actual LAN IP of whichever machine
      # is running Ollama (e.g. http://192.168.0.92:11434), set in .env.nas.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5vl:7b}
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads

  nginx:
    image: nginx:alpine
    network_mode: "host"
    restart: unless-stopped
    volumes:
      - ./frontend/prototype.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/nginx.nas.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  # Public HTTPS access without router port forwarding (not available on this NAS -
  # see 後端開發_CLAUDE.md). Cloudflare's Quick Tunnel gives a public
  # https://*.trycloudflare.com URL that proxies straight to nginx - no account, no
  # domain, no open ports needed. The URL is random and changes every restart; once a
  # real domain is available this should become a named tunnel
  # (`cloudflared tunnel create` + `tunnel route dns`) for a stable hostname instead.
  cloudflared:
    image: cloudflare/cloudflared:latest
    network_mode: "host"
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://localhost:8090
    depends_on:
      - nginx
